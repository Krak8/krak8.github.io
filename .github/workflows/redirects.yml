name: Build short links
on:
  workflow_dispatch:
  push:
    paths:
      - scripts/make_redirects.py
permissions:
  contents: write
  pages: write
concurrency:
  group: site-write-${{ github.ref }}
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Generate redirect pages
        run: python3 scripts/make_redirects.py
      - name: Commit if changed
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --staged --quiet; then echo "Redirect pages are already up to date."; exit 0; fi
          git commit -m "Rebuild short links"
          git pull --rebase origin "${GITHUB_REF_NAME}"
          git push origin "HEAD:${GITHUB_REF_NAME}"
          gh api --method POST "/repos/${{ github.repository }}/pages/builds" || true   # ask Pages to rebuild so the live site sees the new data
