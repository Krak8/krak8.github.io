name: Build short links
on:
  workflow_dispatch:
  push:
    paths:
      - scripts/make_redirects.py
permissions:
  contents: write
  pages: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Generate redirect pages
        run: python3 scripts/make_redirects.py
      - name: Commit if changed
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --staged --quiet || (git commit -m "Rebuild short links" && git push && (gh api --method POST "/repos/${{ github.repository }}/pages/builds" || true))
